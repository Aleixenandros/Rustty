name: CI

# CI separado del release (build.yml). build.yml solo se dispara con tags v*
# y publica el release; aquí validamos PRs y pushes a main para no fusionar
# cambios (p. ej. de Dependabot) sin pasar por compilación, tests y lint.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancela runs anteriores del mismo ref para no acumular ejecuciones cuando
# un PR recibe varios pushes seguidos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Job principal: build JS + check/test Rust en Linux ────────────
  lint-test:
    runs-on: ubuntu-latest
    name: Lint & test · Linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      # El toolchain lo dicta `src-tauri/rust-toolchain.toml` (fuente única). Con
      # `@stable` —flotante— el runner podía traer un Rust más nuevo que el local
      # y romper el build sin haber tocado código: pasó al etiquetar v1.54.0.
      - name: Leer el toolchain fijado
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' src-tauri/rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Misma lista de paquetes apt que build.yml para compilar Tauri en
      # Ubuntu, SIN libssh2-1-dev (el backend usa russh puro). `rpm`/`zstd`
      # no hacen falta aquí porque no empaquetamos, pero los demás sí para
      # que `cargo check` enlace contra webkit/gtk/soup/openssl.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      - name: Install JS dependencies
        run: npm ci

      # Informativo: no bloquea el PR por avisos transitivos de prod.
      - name: npm audit (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # `package.json` es la fuente única de la versión. Este check falla si no
      # está propagada a Cargo, los locks o la matriz de soporte de SECURITY.md
      # (que llegó a prometer parches para una línea ya abandonada).
      - name: Coherencia de versión
        run: npm run check:version

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      # Suites vitest de los módulos puros (subst, markdown, shell-quote,
      # command-suggest): protegen los espejos de contrato frontend⇄backend.
      - name: Test (vitest)
        run: npm test

      # Bloquea regresiones de contraste: los 12 temas base y la biblioteca
      # precargada deben mantenerse en AA (sale con código ≠0 si algo baja).
      - name: Contraste WCAG de temas (estricto)
        run: npm run check:contrast:ci

      # Pariente del anterior: un color de chrome escrito a mano se ve bien en
      # el tema en que se escribió y se rompe en los otros doce. El baseline
      # está a cero y solo puede bajar.
      - name: Colores dentro del sistema de tokens
        run: npm run check:tokens:ci

      # Bloquea regresiones de i18n: texto visible hardcodeado fuera de t(). La
      # paridad de claves no lo ve (esa cadena nunca llega al catálogo). Falla
      # solo con hallazgos NUEVOS: la deuda conocida vive en el baseline y solo
      # puede encoger.
      - name: i18n sin texto hardcodeado (estricto)
        run: npm run check:i18n:ci

      - name: Build frontend
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # ── Clippy ────────────────────────────────────────────────────────
  #   1. Baseline `-D warnings`: **BLOQUEANTE** desde v1.54.0. Los avisos
  #      preexistentes que obligaban al `continue-on-error` están limpios (los
  #      `too_many_arguments` se resolvieron con structs de parámetros:
  #      `TransferCtx`, `SessionSpec`, `RdpTarget`). No introducir avisos nuevos.
  #   2. `-W clippy::pedantic`: aviso permanente (nunca bloqueante) para destapar
  #      mejoras de estilo de cara al troceo de los god-files de backend.
  clippy:
    runs-on: ubuntu-latest
    name: Clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Igual que en el job anterior: la versión de Rust sale del fichero, nunca
      # del canal flotante. Aquí importa el doble, porque clippy es bloqueante y
      # sus lints nuevos llegan con cada versión.
      - name: Leer el toolchain fijado
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' src-tauri/rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      - name: cargo clippy (baseline, bloqueante)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo clippy (pedantic, advisory)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -W clippy::pedantic
        continue-on-error: true

  # ── Cadena de suministro ──────────────────────────────────────────────
  # Tres preguntas distintas sobre lo que acaba dentro del binario:
  #   1. ¿Alguna dependencia tiene un aviso de seguridad? (`cargo deny advisories`)
  #   2. ¿Entró alguna licencia incompatible o una fuente que no es crates.io?
  #      (`bans`, `licenses`, `sources` — el resto de `cargo deny check`)
  #   3. ¿Se ha colado un secreto en el repositorio? (gitleaks)
  # Y de paso se publica el SBOM (CycloneDX de Cargo + el de npm) como
  # artefacto: sin inventario no se puede responder «¿me afecta este CVE?»
  # sobre una versión ya distribuida.
  #
  # Las vulnerabilidades **altas y directas de producción** bloquean; el resto
  # avisa. La política y sus excepciones (con motivo y fecha) viven en
  # `src-tauri/deny.toml`, no en este fichero: una excepción sin justificación
  # escrita es una excepción que nadie revisa.
  supply-chain:
    runs-on: ubuntu-latest
    name: Cadena de suministro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Leer el toolchain fijado
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' src-tauri/rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      # `cargo-deny` y `cargo-cyclonedx` como binarios precompilados: compilarlos
      # desde fuente en cada run costaría más que todo el resto del job.
      - name: Install cargo-deny + cargo-cyclonedx
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-deny,cargo-cyclonedx

      # Bloqueante: un aviso de seguridad no se fusiona sin decidirlo antes.
      - name: cargo-deny (avisos de seguridad)
        working-directory: src-tauri
        run: cargo deny --all-features check advisories

      # Licencias, duplicados y procedencia. Advisory de momento: el árbol de
      # Tauri arrastra duplicados que no dependen de nosotros; se endurece a
      # bloqueante cuando `deny.toml` los tenga todos clasificados.
      - name: cargo-deny (licencias, bans y fuentes)
        working-directory: src-tauri
        run: cargo deny --all-features check bans licenses sources
        continue-on-error: true

      - name: Install JS dependencies
        run: npm ci

      # `npm audit` con nivel alto sobre dependencias de producción. Bloqueante
      # aquí (en el job principal es advisory) porque este job existe justo
      # para eso; las excepciones se documentan al descartarlas.
      - name: npm audit (producción, alto)
        run: npm audit --omit=dev --audit-level=high

      - name: SBOM (CycloneDX de Cargo + npm)
        run: |
          mkdir -p sbom
          (cd src-tauri && cargo cyclonedx --format json --all-features)
          find src-tauri -name '*.cdx.json' -exec cp {} sbom/ \;
          npm sbom --sbom-format cyclonedx --omit dev > sbom/frontend.cdx.json

      - name: Publicar el SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

      # Escaneo de secretos sobre el árbol y su historia. Va al final para que
      # los checks de dependencias se vean aunque este falle.
      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  # ── Cobertura del backend ─────────────────────────────────────────────
  # No bloquea por umbral: un porcentaje mínimo invita a escribir tests que
  # tocan líneas sin comprobar nada. Lo que aporta es el artefacto — ver qué
  # invariante crítico (host keys, merge de sync, pipeline SFTP, quoting) se
  # quedó sin cubrir al tocar código.
  coverage:
    runs-on: ubuntu-latest
    name: Cobertura · Rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Leer el toolchain fijado
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' src-tauri/rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: llvm-tools-preview

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-llvm-cov

      # Sin `--ignored`: los tests de integración necesitan binarios y display
      # (eso es el job `Integración · Linux`). Aquí se mide la batería normal.
      - name: cargo llvm-cov
        working-directory: src-tauri
        run: |
          cargo llvm-cov --locked --lib --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Resumen en el run
        working-directory: src-tauri
        run: |
          {
            echo '### Cobertura del backend'
            echo '```'
            tail -n 3 coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el informe
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-rust
          path: |
            src-tauri/lcov.info
            src-tauri/coverage-summary.txt
          if-no-files-found: error

  # ── Regresión de plataforma: solo build JS + cargo check ──────────
  # Más ligeros que el job Linux; detectan roturas específicas de SO antes
  # de publicar con build.yml.
  platform-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows
          - platform: macos-latest
            label: macOS
    runs-on: ${{ matrix.platform }}
    name: Platform check · ${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Leer el toolchain fijado
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' src-tauri/rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # build.yml en macOS instala openssl@3 y pkgconf vía brew; replicamos
      # lo mínimo. Windows no requiere dependencias de sistema extra.
      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          missing=()
          for formula in openssl@3 pkgconf; do
            if ! brew list --formula "$formula" >/dev/null 2>&1; then
              missing+=("$formula")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            brew install "${missing[@]}"
          else
            echo "macOS dependencies already installed."
          fi

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

  # ── Integración con clientes reales ───────────────────────────────────
  # Los tests marcados `#[ignore]` necesitan binarios y un display que la
  # batería normal no exige, así que corren aquí y solo aquí.
  #
  # Por qué existe este job: en v1.59.0 **toda** conexión RDP en Linux estaba
  # rota con FreeRDP 3 —cambió cómo lee la contraseña— y el CI seguía en verde,
  # porque ningún test ejecutaba un cliente contra algo que hablara el
  # protocolo. Lo encontró el usuario, no la batería. Este job cierra ese hueco:
  # levanta un servidor RDP mínimo (`rdp_fixture.rs`) y comprueba que el cliente
  # de verdad llega a autenticarse. También un `sshd` real (`ssh_fixture.rs`)
  # para el flujo TOFU de host keys, ProxyJump y túneles por el camino de
  # conexión de Rustty; y un servidor FTP/FTPS efímero (`ftp_fixture.rs`, con
  # `libunftp` como dev-dependency, sin paquetes del sistema) para el CRUD del
  # panel y el TOFU de certificados FTPS. Ese último fixture ya se ganó el
  # sueldo: destapó que el cliente FTPS entraba en pánico al elegir proveedor
  # criptográfico de rustls, con la feature recién publicada en v1.61.0.
  integration-linux:
    runs-on: ubuntu-latest
    name: Integración · Linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Leer el toolchain fijado
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' src-tauri/rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      # El nombre del paquete cambia entre releases de Ubuntu y la rama mayor de
      # FreeRDP importa (la 3 es la que rompió la entrega de la contraseña), así
      # que se prueban ambos y se deja la versión en el log.
      - name: Install RDP client + Xvfb
        run: |
          sudo apt-get install -y xvfb
          sudo apt-get install -y freerdp3-x11 || sudo apt-get install -y freerdp2-x11
          for bin in xfreerdp3 xfreerdp; do
            if command -v "$bin" >/dev/null; then
              echo "Cliente RDP: $bin"
              "$bin" /version || true
              exit 0
            fi
          done
          echo "::error::no se instaló ningún cliente xfreerdp"
          exit 1

      # `sshd` real para el fixture SSH. `ssh-keygen` viene con openssh-client,
      # ya presente; `sshd` está en openssh-server, que el runner puede no traer.
      # Sin él, los tests SSH se saltan con gracia (el fixture devuelve None),
      # pero lo instalamos para que corran de verdad. `tmux` es para el test del
      # modo control (`tmux_control_mode_real_sobre_ssh`), que habla el
      # protocolo -CC de un tmux real a través del sshd del fixture.
      - name: Install OpenSSH server + tmux
        run: |
          sudo apt-get install -y openssh-server tmux
          command -v sshd || ls -l /usr/sbin/sshd
          tmux -V

      # `--lib` a propósito: `--ignored` sobre los doctests intentaría compilar
      # los fragmentos marcados `ignore` de `ipc.rs`, que son ilustrativos y no
      # compilan sueltos. Los tests de integración viven en la librería.
      # xvfb-run da el display que xfreerdp exige antes incluso de conectar.
      - name: cargo test (--ignored)
        working-directory: src-tauri
        run: xvfb-run -a cargo test --locked --lib -- --ignored
