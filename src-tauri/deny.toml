# Política de cadena de suministro del backend (`cargo deny`).
#
# La ejecuta el job «Cadena de suministro» de `ci.yml`. Se divide en dos pasos
# a propósito:
#   · `check advisories` es **bloqueante**: una dependencia con aviso de
#     seguridad no se fusiona sin que alguien lo mire.
#   · `check bans licenses sources` es advisory de momento: el árbol de Tauri
#     arrastra duplicados que no dependen de nosotros. Se endurece cuando estén
#     todos clasificados aquí.
#
# Regla de oro de este fichero: **toda excepción lleva motivo y fecha**. Una
# excepción sin justificación escrita es una excepción que nadie vuelve a
# revisar, y a los seis meses ya nadie sabe si sigue haciendo falta.

[graph]
# Solo lo que puede acabar en un binario que distribuimos.
all-features = true

[advisories]
# `deny` para vulnerabilidades, `warn` para lo que solo está sin mantenimiento:
# un crate sin mantenedor es deuda a vigilar, no un fallo de hoy.
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # ── Excepciones activas (revisadas 2026-08-06) ─────────────────────────
  #
  # Las tres son transitivas y **ninguna tiene arreglo desde nuestro
  # Cargo.toml**: se ha comprobado que forzar la versión parcheada no resuelve
  # (ver el motivo de cada una). Cada motivo lleva escrita su fecha de revisión
  # —`cargo-deny` no tiene campo de caducidad—: una excepción sin fecha se queda
  # para siempre.

  { id = "RUSTSEC-2023-0071", reason = "Marvin Attack (timing sidechannel en `rsa`). Llega por `russh` → `ssh-key`; el propio aviso dice «No safe upgrade is available» y no hay versión parcheada que forzar. Alcance en Rustty: solo afecta a las claves de cliente RSA al firmar la autenticación; un atacante necesitaría medir con precisión los tiempos de NUESTRAS firmas. Se mitiga usando Ed25519, que es lo que recomienda el asistente de «acceso sin contraseña». REVISAR ANTES DE 2027-02-06; cuando RustCrypto publique la implementación de tiempo constante." },

  { id = "RUSTSEC-2026-0194", reason = "Coste cuadrático de `quick-xml` al detectar atributos duplicados. Bloqueado upstream: llega por `wayland-scanner`, que pide `quick-xml ^0.39`, así que `cargo update --precise 0.41.0` es imposible sin parchear ese crate. Alcance en Rustty: `wayland-scanner` corre en **tiempo de compilación** y solo lee los XML de protocolo Wayland que vienen con el propio crate — no procesa nada que venga de un servidor ni del usuario. REVISAR ANTES DE 2027-02-06; retirar cuando `wayland-scanner` suba a quick-xml 0.41." },

  { id = "RUSTSEC-2026-0195", reason = "Agotamiento de memoria por declaraciones de espacio de nombres sin límite en `quick-xml` (`NsReader`). Mismo origen, mismo bloqueo y mismo alcance que RUSTSEC-2026-0194: se resuelven juntas al subir `wayland-scanner`. REVISAR ANTES DE 2027-02-06." },

  # ── Excepciones añadidas el 2026-10-17 ─────────────────────────────────────
  #
  # Las tres son del crate `zip` 4.x y se arreglan en `zip` >= 9, pero llegan
  # por `tauri-plugin-updater` (2.13.1, la última estable; la 3.x es alfa), que
  # pide `zip 4`: no hay versión que forzar desde nuestro Cargo.toml. Alcance en
  # Rustty: el updater solo descomprime el paquete de actualización que él mismo
  # ha descargado de nuestra release y cuya firma minisign ha **verificado
  # antes** contra la clave pública embebida; un archivo malicioso no llega a
  # `extract()` sin una firma válida. Además el uso de `zip` es solo para los
  # paquetes de Windows (`.nsis.zip`/`.msi.zip`), donde no existen los permisos
  # Unix ni los bits SUID de los avisos.

  { id = "RUSTSEC-2026-0367", reason = "`zip` conserva los bits SUID/SGID al extraer. Llega por `tauri-plugin-updater` → `zip 4`; sin versión del updater con `zip` 9. Solo extrae paquetes de nuestra release ya verificados por firma, y solo en Windows, donde no hay bits SUID. REVISAR ANTES DE 2027-04-17; retirar cuando `tauri-plugin-updater` suba a `zip` 9." },

  { id = "RUSTSEC-2026-0368", reason = "`ZipArchive::extract` crea enlaces simbólicos con destino fuera de la carpeta. Mismo origen, mismo bloqueo y mismo alcance que RUSTSEC-2026-0367 (paquete verificado por firma antes de extraer). REVISAR ANTES DE 2027-04-17." },

  { id = "RUSTSEC-2026-0369", reason = "`zip` aplica permisos Unix a través de enlaces simbólicos sin acotar el destino. Mismo origen, mismo bloqueo y mismo alcance que RUSTSEC-2026-0367. REVISAR ANTES DE 2027-04-17." },
]

[licenses]
# Compatibles con la Apache-2.0 del proyecto. Cualquier otra obliga a una
# decisión explícita: se añade aquí o se retira la dependencia.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "OpenSSL",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# `ring` combina ISC/MIT/OpenSSL con su propio texto derivado de BoringSSL.
name = "ring"
allow = ["ISC", "MIT", "OpenSSL"]

[bans]
# Duplicados: avisar, no romper. La mitad vienen del árbol de Tauri y no están
# en nuestra mano; lo que importa es verlos crecer.
multiple-versions = "warn"
wildcards = "deny"
# Un `*` en Cargo.toml propio sí es culpa nuestra y sí rompe.
allow-wildcard-paths = false

[[bans.deny]]
# `openssl` vendorizado: el backend habla TLS con rustls (proveedor `ring`).
# Si aparece, es que una dependencia nueva lo arrastró — y eso cambia lo que
# distribuimos y cómo se firma. Ver el invariante del proveedor rustls.
name = "openssl-src"

[sources]
# Todo debe venir de crates.io. Un git suelto en el árbol es código sin
# revisión de crates.io ni versión reproducible.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
